name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ARCHS="arm64 x86_64" ./scripts/build-app.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist if it was created on github.com
          # (Releases → Draft a new release); then just attach the zip.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/Cooldown-*.zip --clobber
          else
            flags=()
            [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)   # v1.0.0-rc1
            gh release create "$GITHUB_REF_NAME" build/Cooldown-*.zip \
              --title "Cooldown $GITHUB_REF_NAME" \
              --generate-notes "${flags[@]}"
          fi
