name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: ARCHS="arm64 x86_64" ./scripts/build-app.sh

      - name: Check architectures
        run: |
          archs="$(lipo -archs build/Cooldown.app/Contents/MacOS/Cooldown)"
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      - uses: actions/upload-artifact@v4
        with:
          name: Cooldown-app
          path: build/*.zip
